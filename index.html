<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Book Swiper</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://tailwindcss.com"></script>
  <!-- Custom CSS Layer -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col items-center justify-between p-4 no-select">

  
  <div id="setup-screen" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center p-6 z-50 text-white">
    <h1 class="text-3xl font-bold mb-4">📚 Book Swiper</h1>
    <p class="text-slate-400 mb-6 text-center max-w-sm">Enter your name so the app tracks who is swiping and adding books.</p>
    <input type="text" id="username-input" placeholder="Your Name" class="w-full max-w-xs px-4 py-2 rounded bg-slate-800 border border-slate-700 text-white text-center focus:outline-none focus:border-indigo-500 mb-4">
    <button onclick="saveUsername()" class="w-full max-w-xs bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded font-semibold transition">Join Pool</button>
  </div>

  <!-- Header Section -->
  <header class="w-full max-w-md flex justify-between items-center py-2 border-b border-slate-200">
    <div>
      <h2 class="text-xl font-bold text-slate-800">Book Swipe Pool</h2>
      <p id="user-display" class="text-xs text-slate-500"></p>
    </div>
    <button onclick="toggleModal(true)" class="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-sm font-semibold shadow hover:bg-indigo-700 transition">+ Add Book</button>
  </header>

    <!-- Main Deck View Window -->
  <main class="relative w-full max-w-md h-[450px] flex items-center justify-center my-auto">
    
    <!-- Updated Empty State Holder containing your End-of-Deck matches list -->
    <div id="empty-state" class="w-full max-w-xs text-center p-6 hidden bg-white border border-slate-200 rounded-2xl shadow-xl">
      <div class="text-3xl mb-2">🏆</div>
      <h3 class="text-xl font-bold text-slate-800">You're All Caught Up!</h3>
      <p class="text-xs text-slate-400 mt-1 mb-4">Here are the books your group has agreed on so far:</p>
      
      <!-- List container where matches inject -->
      <div id="end-matches-list" class="space-y-2 max-h-60 overflow-y-auto text-left"></div>
    </div>

    <!-- Interactive Swiper Layer -->
    <div id="card-container" class="relative w-72 h-96 flex items-center justify-center"></div>
  </main>


  <!-- Manual Swipe Triggers -->
  <footer class="w-full max-w-md flex justify-around items-center py-4">
    <button onclick="handleManualSwipe('left')" class="bg-red-100 hover:bg-red-200 text-red-600 p-4 rounded-full shadow-lg transition">
      ❌ Left (Skip)
    </button>
    <button onclick="handleManualSwipe('right')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-600 p-4 rounded-full shadow-lg transition">
      ❤️ Right (Keep)
    </button>
  </footer>

  <!-- Modal for Submitting New Database Rows -->
  <div id="add-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Suggest a New Book</h3>
      <div class="space-y-3">
        <input type="text" id="book-title" placeholder="Book Title" class="w-full border border-slate-300 p-2 rounded focus:outline-none focus:border-indigo-500">
        <input type="text" id="book-author" placeholder="Author (Optional)" class="w-full border border-slate-300 p-2 rounded focus:outline-none focus:border-indigo-500">
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button onclick="toggleModal(false)" class="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-50">Cancel</button>
        <button onclick="submitBook()" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Add to Pool</button>
      </div>
    </div>
  </div>

  <!-- Native JavaScript Modules -->
  <script src="assets/js/db.js" type="module"></script>
  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
