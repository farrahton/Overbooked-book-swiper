<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Book Pool</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="no-select">

  <!-- ============================= -->
  <!-- USER SETUP -->
  <!-- ============================= -->

  <div id="setup-screen" class="modal-overlay setup-overlay">

    <div class="setup-content">

      <h1 class="font-serif setup-title">
        the book pool.
      </h1>

      <p class="setup-subtitle">
        Enter your reader signature to join Overbooked's stack.
      </p>

      <input
        type="text"
        id="username-input"
        placeholder="Your Name"
        class="modal-input setup-input"
      >

      <button
        onclick="saveUsername()"
        class="btn-primary"
      >
        Enter Overbooked
      </button>

    </div>

  </div>


  <!-- ============================= -->
  <!-- HEADER -->
  <!-- ============================= -->

  <header>

    <div>

      <h2 class="font-serif">
        Overbooked's TBR 📚
      </h2>

      <p id="user-display"></p>

    </div>

    <div class="header-actions">

      <button
        onclick="toggleModal(true)"
        class="btn-outline"
      >
        + Add Title
      </button>

      <!-- <button
       RESET FEATURE DISABLED FOR NOW
        onclick="resetMySwipes()"
        class="btn-reset"
      >
        Reset
      </button> -->

    </div>

  </header>


  <!-- ============================= -->
  <!-- MAIN -->
  <!-- ============================= -->

  <main id="main-content">

    <!-- =========================== -->
    <!-- BOOK CARD AREA -->
    <!-- =========================== -->

    <div
      id="card-container"
      class="card-container"
    ></div>


    <!-- =========================== -->
    <!-- EMPTY / LEADERBOARD -->
    <!-- =========================== -->

    <div
      id="empty-state"
      class="empty-box hidden"
    >

      <div class="empty-icon">
        ✨
      </div>

      <h3 class="font-serif empty-title">
        End of the Chapter
      </h3>

      <p class="empty-subtitle">
        Here is where we stand on current choices:
      </p>

      <div
        id="end-matches-list"
        class="leaderboard-container"
      ></div>

    </div>

  </main>


  <!-- ============================= -->
  <!-- BOTTOM CONTROLS -->
  <!-- ============================= -->

  <footer>

    <button
      onclick="handleManualSwipe('left')"
      class="footer-btn btn-pass"
    >
      Pass
    </button>

    <div class="divider-line"></div>

    <button
      onclick="handleManualSwipe('right')"
      class="footer-btn btn-keep"
    >
      Keep
    </button>

  </footer>


  <!-- ============================= -->
  <!-- ADD BOOK MODAL -->
  <!-- ============================= -->

  <div
    id="add-modal"
    class="modal-overlay hidden"
  >

    <div class="modal-content">

      <h3 class="font-serif modal-title">
        Propose a book
      </h3>

      <div>

        <input
          type="text"
          id="book-title"
          placeholder="Title"
          class="modal-input"
        >

        <input
          type="text"
          id="book-author"
          placeholder="Author"
          class="modal-input"
        >

        <input
          type="url"
          id="book-cover-manual"
          placeholder="Cover Image URL"
          class="modal-input"
        >

        <textarea
          id="book-description-manual"
          placeholder="Custom Description/Notes"
          class="modal-input description-input"
        ></textarea>

      </div>

      <div class="modal-actions">

        <button
          onclick="toggleModal(false)"
          class="btn-cancel"
        >
          Dismiss
        </button>

        <button
          onclick="submitBook()"
          class="btn-primary modal-submit"
        >
          Submit
        </button>

      </div>

    </div>

  </div>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <script
    src="assets/js/db.js?v=21"
    type="module"
  ></script>

  <script
    src="assets/js/app.js?v=21"
    type="module"
  ></script>

</body>
</html>
